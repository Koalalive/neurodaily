[project]
name = "neurodaily"
version = "1.0.8"
description = "Daily neuroscience/psychiatry literature & industry digest (arXiv, PubMed, bioRxiv, FDA, ClinicalTrials, policy news) → HTML report."
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "certifi>=2026.10.18",
    "feedparser>=6.0",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "langgraph>=1.2.24,<2",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
]

[project.optional-dependencies]
topics = ["scikit-learn>=1.4"]
mcp = ["mcp>=1.30,<2"]
test = ["beautifulsoup4>=4.12", "soupsieve>=4.0"]

[project.scripts]
neurodaily = "neurodaily.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neurodaily*"]

[tool.setuptools.package-data]
neurodaily = ["templates/*.j2", "data/presets/*.json", "data/conferences.json", "data/search_quality_sample.json", "data/natural_earth_*.json", "static/optimization/*"]
