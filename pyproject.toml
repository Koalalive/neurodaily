[project]
name = "neurodaily"
version = "0.1.0"
description = "Daily neuroscience/psychiatry literature & industry digest (arXiv, PubMed, bioRxiv, FDA, ClinicalTrials, policy news) → HTML report."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "feedparser>=6.0",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
]

[project.scripts]
neurodaily = "neurodaily.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neurodaily*"]

[tool.setuptools.package-data]
neurodaily = ["templates/*.j2"]
