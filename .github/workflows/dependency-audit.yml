name: dependency-audit

on:
  push:
    branches: [main]
    paths: ['.github/requirements-digest.txt', 'desktop/tauri/package-lock.json', '.github/workflows/dependency-audit.yml']
  pull_request:
    paths: ['.github/requirements-digest.txt', 'desktop/tauri/package-lock.json', '.github/workflows/dependency-audit.yml']
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit locked Python dependencies
        run: |
          python -m pip install 'pip-audit==2.10.1'
          pip-audit --disable-pip --no-deps --require-hashes -r .github/requirements-digest.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Audit npm lockfile
        run: npm --prefix desktop/tauri audit --package-lock-only --audit-level=high
