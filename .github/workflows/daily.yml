name: daily-digest

on:
  schedule:
    - cron: "0 0 * * *"   # 08:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:
    inputs:
      demo:
        description: "Run with offline demo data"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  digest:
    environment:
      name: automation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e .
      - name: Materialize config from secrets
        env:
          RUN_DEMO: ${{ inputs.demo }}
          CONFIG_JSON: ${{ secrets.NEURODAILY_CONFIG_JSON }}
          EMAIL_JSON: ${{ secrets.NEURODAILY_EMAIL_JSON }}
          AI_JSON: ${{ secrets.NEURODAILY_AI_JSON }}
        run: |
          umask 077
          export NEURODAILY_HOME="$RUNNER_TEMP/neurodaily"
          printf 'NEURODAILY_HOME=%s\n' "$NEURODAILY_HOME" >> "$GITHUB_ENV"
          mkdir -p "$NEURODAILY_HOME/config" "$NEURODAILY_HOME/output"
          if [ "$RUN_DEMO" != "true" ] && [ -n "$CONFIG_JSON" ]; then
            printf '%s' "$CONFIG_JSON" > "$NEURODAILY_HOME/config/config.json"
          else
            .venv/bin/python -m neurodaily config init >/dev/null
          fi
          if ! .venv/bin/python -m neurodaily config validate >/dev/null; then
            echo 'NeuroDaily config is invalid. Validate the source JSON locally before updating the secret.'
            exit 1
          fi
          if [ "$RUN_DEMO" != "true" ]; then
            if [ -n "$EMAIL_JSON" ]; then
              printf '%s' "$EMAIL_JSON" > "$NEURODAILY_HOME/config/email.json"
            fi
            if [ -n "$AI_JSON" ]; then
              printf '%s' "$AI_JSON" > "$NEURODAILY_HOME/config/ai_summary.json"
            fi
          fi
      - name: Run digest
        env:
          RUN_DEMO: ${{ inputs.demo }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          NEURODAILY_SMTP_PASSWORD: ${{ secrets.NEURODAILY_SMTP_PASSWORD }}
          NEURODAILY_LLM_API_KEY: ${{ secrets.NEURODAILY_LLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.NEURODAILY_LLM_API_KEY }}
        run: |
          report="$NEURODAILY_HOME/output/report.html"
          if [ "$RUN_DEMO" = "true" ]; then
            .venv/bin/python -m neurodaily run --demo --no-open --output "$report"
          elif [ "$PRIVATE_REPOSITORY" = "true" ]; then
            .venv/bin/python -m neurodaily run --mode daily --no-open --output "$report"
          else
            run_log="$NEURODAILY_HOME/output/digest.log"
            if ! .venv/bin/python -m neurodaily run --mode daily --no-open --output "$report" >"$run_log" 2>&1; then
              echo 'Daily run failed. Reproduce with the same configuration in a private environment.'
              exit 1
            fi
            echo 'Daily run completed. Check the configured delivery destination.'
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ github.event.repository.private == true || inputs.demo == true }}
        with:
          name: neurodaily-report
          path: ${{ env.NEURODAILY_HOME }}/output/report.html
          if-no-files-found: error
          retention-days: 14
