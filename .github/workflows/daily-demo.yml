name: daily-demo

on:
  schedule:
    # 08:00 Asia/Shanghai (UTC+8)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-demo
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    environment:
      name: automation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --only-binary=:all: --require-hashes -r .github/requirements-digest.txt
          .venv/bin/python -c "import sklearn; print('sklearn', sklearn.__version__)"

      - name: Verify demo configuration
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("config/demo.json").read_text(encoding="utf-8"))
          assert int(cfg["windows"]["trials_hours"]) >= 168, cfg["windows"]
          assert int(cfg["sources"]["trials"]["lookback_days"]) >= 7, cfg["sources"]["trials"]
          print("demo config: 168h trials window")
          PY

      - name: Build 168h public demo
        env:
          DEEPSEEK_API_KEY: ${{ secrets.NEURODAILY_LLM_API_KEY }}
          NEURODAILY_NO_OPEN: "1"
          NEURODAILY_HOME: ${{ runner.temp }}/neurodaily
          NEURODAILY_DEMO_DIR: ${{ runner.temp }}/public-demo
          PYTHONPATH: ${{ github.workspace }}
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo 'Model API key is missing.'; exit 1; }
          .venv/bin/python scripts/build_demo_snapshot.py
          .venv/bin/python scripts/verify_demo_snapshot.py "$NEURODAILY_DEMO_DIR"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-demo
          path: |
            ${{ runner.temp }}/public-demo/latest-report.zh.html
            ${{ runner.temp }}/public-demo/latest-report.en.html
            ${{ runner.temp }}/public-demo/latest-report.ru.html
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-demo
          path: ${{ runner.temp }}/public-demo
      - name: Verify public files before copying
        run: |
          snapshot="$RUNNER_TEMP/public-demo"
          python3 scripts/verify_demo_snapshot.py "$snapshot"
          for lang in zh en ru; do
            cp "$snapshot/latest-report.$lang.html" "docs/demo/latest-report.$lang.html"
          done

      - name: Commit updated demo
        run: |
          # Ignore a snapshot if a code update landed during generation.
          if ! git diff --quiet "$GITHUB_SHA" HEAD -- . ':(exclude)docs/demo'; then
            echo 'Source changed during generation. Leave the current snapshot in place.'
            exit 0
          fi
          git config user.name "neurodaily-bot"
          git config user.email "neurodaily-bot@users.noreply.github.com"
          mkdir -p docs/demo
          # A daily heartbeat keeps the public workflow active even when the
          # 168h result set is unchanged for a day.
          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > docs/demo/last-updated.txt
          git add docs/demo/latest-report.zh.html docs/demo/latest-report.en.html docs/demo/latest-report.ru.html docs/demo/last-updated.txt
          if git diff --cached --quiet; then
            echo "No demo changes"
            exit 0
          fi
          git commit -m "chore: update daily demo snapshot [skip ci]"
          # Main can advance while the demo is being built. Keep the freshly
          # generated demo and rebase/merge onto the latest main before pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- . ':(exclude)docs/demo'; then
              echo 'Source changed during publication. Leave the current snapshot in place.'
              exit 0
            fi
            git merge --no-edit -X ours origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not push daily demo after 3 attempts" >&2
          exit 1
