name: daily-demo

on:
  schedule:
    # 08:00 Asia/Shanghai (UTC+8)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-demo
  cancel-in-progress: false

jobs:
  update-demo:
    environment:
      name: automation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ".[topics]" "scikit-learn>=1.4"
          .venv/bin/python -c "import sklearn; print('sklearn', sklearn.__version__)"

      - name: Verify demo configuration
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("config/demo.json").read_text(encoding="utf-8"))
          assert int(cfg["windows"]["trials_hours"]) >= 168, cfg["windows"]
          assert int(cfg["sources"]["trials"]["lookback_days"]) >= 7, cfg["sources"]["trials"]
          print("demo config: 168h trials window")
          PY

      - name: Build 168h public demo
        env:
          DEEPSEEK_API_KEY: ${{ secrets.NEURODAILY_LLM_API_KEY }}
          NEURODAILY_NO_OPEN: "1"
        run: .venv/bin/python scripts/build_demo_snapshot.py

      - name: Verify generated demo
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          for lang in ("zh", "en", "ru"):
              page = Path(f"docs/demo/latest-report.{lang}.html").read_text(encoding="utf-8")
              assert 'id="trials"' in page and 'id="conferences"' in page
              assert 'data-no-i18n>🗓️ 学术会议' not in page
              assert 'id="ai-summary"' in page, "AI summary missing (check NEURODAILY_LLM_API_KEY)"
              assert 'id="research-activity"' in page, "research activity map missing"
              assert 'id="prompt"' not in page, "private focus prompt leaked to public demo"
          print("demo pages contain trials, conferences, AI summary, map and no private prompt")
          PY

      - name: Commit updated demo
        run: |
          git config user.name "neurodaily-bot"
          git config user.email "neurodaily-bot@users.noreply.github.com"
          mkdir -p docs/demo
          # A daily heartbeat keeps the public workflow active even when the
          # 168h result set is unchanged for a day.
          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > docs/demo/last-updated.txt
          git add docs/demo/latest-report.zh.html docs/demo/latest-report.en.html docs/demo/latest-report.ru.html docs/demo/last-updated.txt
          if git diff --cached --quiet; then
            echo "No demo changes"
            exit 0
          fi
          git commit -m "chore: update daily demo snapshot [skip ci]"
          # Main can advance while the demo is being built. Keep the freshly
          # generated demo and rebase/merge onto the latest main before pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            git merge --no-edit -X ours origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not push daily demo after 3 attempts" >&2
          exit 1
