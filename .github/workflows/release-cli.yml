name: Release CLI / Homebrew

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing cli-vX.Y.Z tag"
        required: true

permissions:
  contents: read

jobs:
  wheel:
    name: Build and verify CLI wheel
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify release metadata
        run: python scripts/verify_release_version.py package --tag "$RELEASE_TAG"

      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir cli-dist

      - name: Verify wheel
        run: python scripts/verify_release_version.py package --tag "$RELEASE_TAG" --wheels cli-dist

      - name: Smoke test wheel
        run: |
          wheel=$(find "$PWD/cli-dist" -name '*.whl' -type f)
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "$wheel"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          export NEURODAILY_HOME="$RUNNER_TEMP/neurodaily-home"
          "$RUNNER_TEMP/wheel-venv/bin/neurodaily" demo --no-open
          compgen -G "$NEURODAILY_HOME/output/*.html" >/dev/null

      - name: Stage the verified wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-wheel
          path: cli-dist/*.whl
          if-no-files-found: error

  homebrew:
    name: Verify Homebrew formula (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install formula from the tagged checkout
        run: bash scripts/test_homebrew.sh

  docker:
    name: Build and publish Docker image
    needs: [wheel, homebrew]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DOCKER_IMAGE: docker.io/koalalive/neurodaily
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'koalalive' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve image version
        id: version
        shell: bash
        run: echo "value=${RELEASE_TAG#cli-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.DOCKER_IMAGE }}:latest

  publish:
    name: Publish the verified CLI release
    needs: [wheel, homebrew, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Fetch the verified wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-wheel
          path: cli-dist
      - name: Publish CLI release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "NeuroDaily CLI / Homebrew ${{ env.RELEASE_TAG }}"
          make_latest: false
          generate_release_notes: true
          files: cli-dist/*.whl
          fail_on_unmatched_files: true
