name: Release CLI / Homebrew

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing cli-vX.Y.Z tag"
        required: true

permissions:
  contents: read

jobs:
  wheel:
    name: Build and verify CLI wheel
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify release metadata
        run: python scripts/verify_release_version.py package --tag "$RELEASE_TAG"

      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir cli-dist

      - name: Verify wheel
        run: python scripts/verify_release_version.py package --tag "$RELEASE_TAG" --wheels cli-dist

      - name: Smoke test wheel
        run: |
          wheel=$(find "$PWD/cli-dist" -name '*.whl' -type f)
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "$wheel"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          export NEURODAILY_HOME="$RUNNER_TEMP/neurodaily-home"
          "$RUNNER_TEMP/wheel-venv/bin/neurodaily" demo --no-open
          compgen -G "$NEURODAILY_HOME/output/*.html" >/dev/null

      - name: Stage the verified wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-wheel
          path: cli-dist/*.whl
          if-no-files-found: error

  homebrew:
    name: Verify Homebrew formula (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install formula from the tagged checkout
        run: bash scripts/test_homebrew.sh

  publish:
    name: Publish the verified CLI release
    needs: [wheel, homebrew]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Fetch the verified wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-wheel
          path: cli-dist
      - name: Publish CLI release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "NeuroDaily CLI / Homebrew ${{ env.RELEASE_TAG }}"
          make_latest: false
          generate_release_notes: true
          files: cli-dist/*.whl
          fail_on_unmatched_files: true
