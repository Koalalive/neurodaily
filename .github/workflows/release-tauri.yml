name: Release Tauri desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-13
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: Python venv (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pyinstaller

      - name: Python venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install -e . pyinstaller

      - name: Build sidecar (Unix)
        if: runner.os != 'Windows'
        run: bash desktop/build_sidecar.sh

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/build_sidecar.ps1

      - name: Install Tauri CLI
        working-directory: desktop/tauri
        run: npm install

      - name: Generate icons
        working-directory: desktop/tauri
        run: npm run icon

      - name: Build app
        working-directory: desktop/tauri
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurodaily-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**
            desktop/tauri/src-tauri/target/release/bundle/**

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            desktop/tauri/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/tauri/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/tauri/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/tauri/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/tauri/src-tauri/target/**/release/bundle/deb/*.deb
