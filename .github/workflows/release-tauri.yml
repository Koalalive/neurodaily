name: Release NeuroDaily

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
      - "verify/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/heads/verify/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev xvfb xauth

      - name: Python venv (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[topics]" pyinstaller

      - name: Python venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install -e ".[topics]" pyinstaller

      - name: Install Tauri CLI
        working-directory: desktop/tauri
        run: npm ci

      - name: Generate icons
        working-directory: desktop/tauri
        run: npm run icon

      - name: Build sidecar (Unix)
        if: runner.os != 'Windows'
        run: bash desktop/build_sidecar.sh

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/build_sidecar.ps1

      - name: Smoke test frozen sidecar
        run: python desktop/sidecar/smoke.py desktop/tauri/src-tauri/binaries/neurodaily-server-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Build preview app
        if: github.ref_type != 'tag'
        working-directory: desktop/tauri
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci

      - name: Build signed release app
        if: github.ref_type == 'tag'
        working-directory: desktop/tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updates.conf.json --ci

      - name: Verify Windows icons and hidden helper launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./desktop/verify_windows_icons.ps1 -Target '${{ matrix.target }}' -ReleaseDir 'desktop/tauri/src-tauri/target/${{ matrix.target }}/release'
          cargo test --manifest-path desktop/tauri/src-tauri/Cargo.toml --locked --release --target '${{ matrix.target }}' --features custom-protocol

      - name: Verify scheduled search from the installed Debian package
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUNDLE_DIR: desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          version=$(node -p "require('./desktop/tauri/src-tauri/tauri.conf.json').version")
          deb="$PWD/$BUNDLE_DIR/deb/NeuroDaily_${version}_amd64.deb"
          sudo apt-get install -y "$deb"
          package=$(dpkg-deb -f "$deb" Package)
          test "$(dpkg-query -W -f='${Version}' "$package")" = "$version"
          test -x /usr/bin/neurodaily-server
          xvfb-run -a python desktop/sidecar/smoke.py --desktop --expect-version "$version" /usr/bin/neurodaily-desktop

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neurodaily-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  homebrew:
    name: Verify macOS Homebrew (${{ matrix.os }})
    if: ${{ !startsWith(github.ref, 'refs/heads/verify/') || startsWith(github.ref, 'refs/heads/verify/homebrew-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the formula and verify the localhost workspace
        run: bash scripts/test_homebrew.sh

  windows-installer:
    name: Verify Windows installer (${{ matrix.scenario }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean, upgrade]
    env:
      BASELINE_TAG: v1.0.7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: neurodaily-x86_64-pc-windows-msvc
          path: installers
      - name: Download and verify previously published installer
        if: matrix.scenario == 'upgrade'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:BASELINE_TAG.TrimStart('v')
          $assetName = "NeuroDaily_${version}_x64-setup.exe"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:BASELINE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft -or $release.prerelease) {
            throw "Could not read stable release $env:BASELINE_TAG"
          }
          $assets = @($release.assets | Where-Object { $_.name -eq $assetName })
          if ($assets.Count -ne 1 -or $assets[0].digest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Missing installer or digest for $env:BASELINE_TAG"
          }
          gh release download $env:BASELINE_TAG --repo $env:GITHUB_REPOSITORY --dir baseline --pattern $assetName
          if ($LASTEXITCODE -ne 0) { throw "Could not download $assetName" }
          $actual = (Get-FileHash (Join-Path baseline $assetName) -Algorithm SHA256).Hash
          if ("sha256:$actual" -ne $assets[0].digest) { throw "Baseline installer digest mismatch" }
      - name: Run installed desktop application's scheduled-search regression
        shell: pwsh
        env:
          INSTALL_SCENARIO: ${{ matrix.scenario }}
        run: |
          $version = (Get-Content -Raw desktop/tauri/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $candidate = @(Get-ChildItem installers -File -Recurse -Filter "NeuroDaily_${version}_x64-setup.exe")
          if ($candidate.Count -ne 1) { throw "Expected exactly one candidate setup EXE" }
          $smokeArgs = @('desktop/sidecar/installer_smoke.py', $candidate[0].FullName, $version)
          if ($env:INSTALL_SCENARIO -eq 'upgrade') {
            $baselineVersion = $env:BASELINE_TAG.TrimStart('v')
            $smokeArgs += @('--baseline', "baseline/NeuroDaily_${baselineVersion}_x64-setup.exe", '--baseline-version', $baselineVersion)
          }
          & python @smokeArgs

  extra-installer:
    name: Verify ${{ matrix.scenario }}
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (startsWith(github.ref, 'refs/heads/verify/') && !startsWith(github.ref, 'refs/heads/verify/homebrew-'))) }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: Windows MSI
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - scenario: Linux package upgrade and native dialogs
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      BASELINE_TAG: v1.0.7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Locate package artifacts
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$GITHUB_RUN_ID"
          if [[ "$GITHUB_REF_NAME" == verify/* ]]; then
            branch="release/${GITHUB_REF_NAME#verify/}-preview"
            run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/release-tauri.yml/runs" \
              -f branch="$branch" -f event=push -f status=success -f per_page=1 --jq '.workflow_runs[0].id // empty')
            test -n "$run_id"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifacts.outputs.run_id }}
          name: neurodaily-${{ matrix.target }}
          path: installers
      - name: Install and run Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw desktop/tauri/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $candidate = @(Get-ChildItem installers -File -Recurse -Filter "NeuroDaily_${version}_x64_en-US.msi")
          if ($candidate.Count -ne 1) { throw 'Expected exactly one MSI candidate' }
          & python desktop/sidecar/msi_smoke.py $candidate[0].FullName $version
      - name: Install Linux smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb xauth webkit2gtk-driver xdotool
      - name: Download and verify the published Debian installer
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          baseline="NeuroDaily_${BASELINE_TAG#v}_amd64.deb"
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BASELINE_TAG" --jq \
            ". | select(.draft == false and .prerelease == false) | .assets[] | select(.name == \"$baseline\") | .digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --dir baseline --pattern "$baseline"
          printf '%s  %s\n' "${digest#sha256:}" "baseline/$baseline" | sha256sum -c -
      - name: Verify Linux upgrade, AppImage and native dialog interaction
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("desktop/tauri/src-tauri/tauri.conf.json"))["version"])')
          previous="${BASELINE_TAG#v}"
          deb=$(find "$PWD/installers" -type f -name "NeuroDaily_${version}_amd64.deb")
          image=$(find "$PWD/installers" -type f -name "NeuroDaily_${version}_amd64.AppImage")
          test -f "$deb" && test -f "$image"
          xvfb-run -a python desktop/sidecar/linux_installer_smoke.py "$deb" "$version" --baseline "baseline/NeuroDaily_${previous}_amd64.deb" --baseline-version "$previous"
          xvfb-run -a python desktop/sidecar/linux_installer_smoke.py "$image" "$version"
          xvfb-run -a python desktop/sidecar/native_ui_smoke.py /usr/bin/neurodaily-desktop "$version"

  cli-wheel:
    name: Build and verify the Python CLI wheel
    if: ${{ !startsWith(github.ref, 'refs/heads/verify/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify release metadata and build the wheel
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          python scripts/verify_release_version.py package "${args[@]}"
          python -m pip install build
          python -m build --wheel --outdir cli-dist
          python scripts/verify_release_version.py package "${args[@]}" --wheels cli-dist
      - name: Install and smoke test the CLI wheel
        shell: bash
        run: |
          wheel=$(find "$PWD/cli-dist" -name '*.whl' -type f)
          python -m venv "$RUNNER_TEMP/neurodaily-wheel-venv"
          cli="$RUNNER_TEMP/neurodaily-wheel-venv/bin"
          "$cli/python" -m pip install "$wheel"
          "$cli/python" -m pip check
          cd "$RUNNER_TEMP"
          export NEURODAILY_HOME="$RUNNER_TEMP/neurodaily-wheel-home"
          "$cli/neurodaily" web --help
          "$cli/neurodaily" demo --no-open
          compgen -G "$NEURODAILY_HOME/output/*.html" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neurodaily-cli-wheel
          path: cli-dist/*.whl
          if-no-files-found: error

  publish:
    needs: [build, homebrew, windows-installer, extra-installer, cli-wheel]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: neurodaily-release-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      DOCKER_IMAGE: docker.io/koalalive/neurodaily
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'koalalive' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the tag and check release state
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/verify_release_version.py package --tag "$GITHUB_REF_NAME")
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          publish=$(python3 scripts/verify_release_version.py release-state "$GITHUB_REF_NAME" "$RUNNER_TEMP/releases.json")
          printf 'version=%s\nrevision=%s\npublish=%s\n' "$version" "$(git rev-parse HEAD)" "$publish" >> "$GITHUB_OUTPUT"
          if [[ "$publish" == false ]]; then printf 'Release %s is already published.\n' "$GITHUB_REF_NAME"; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.release_state.outputs.publish == 'true'
        with:
          pattern: neurodaily-*
          path: installers
          merge-multiple: true
      - name: Verify installers, signatures and CLI wheel
        if: steps.release_state.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign skopeo
          python3 desktop/verify_update_assets.py installers "$GITHUB_REF_NAME"
          python3 scripts/verify_release_version.py package --tag "$GITHUB_REF_NAME" --wheels installers
      - name: Upload assets to draft release
        if: steps.release_state.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            macOS 使用 Homebrew 安装命令行，并用 `neurodaily web` 在默认浏览器打开本机工作区。支持 Apple Silicon 和 Intel。安装与旧版数据迁移见 [macOS Homebrew 指南](https://github.com/Koalalive/neurodaily/blob/main/docs/MACOS_HOMEBREW.md)。

            Release 附带 Python CLI wheel。同一版本的 `koalalive/neurodaily` Docker 镜像支持 Linux amd64 和 arm64。

            Windows 验证了 NSIS 和 MSI 全新安装，以及从 v1.0.4 覆盖升级。Ubuntu 验证了 DEB 安装和覆盖升级，以及 AppImage 解包运行。

            桌面工作区采用单行标签页，常用页面复用已打开的标签，最新日报标签显示生成日期。每次检索仍会打开独立的结果标签页。

            日报在 AI 摘要之后显示离线研究地图，移除文献计量卡片。设置中可查看每次模型调用的 token 和费用估算。可选的 AI 地理定位默认关闭，底图数据来自 Natural Earth。

            新闻、政策和试验支持独立检索规则。PubMed 补查晚入库论文，ClinicalTrials.gov 支持分批翻页。历史条目可在本机检索，设置中可按需开启新增来源。

          fail_on_unmatched_files: true
          files: |
            installers/**/*.msi
            installers/**/*.exe
            installers/**/*.AppImage
            installers/**/*.deb
            installers/**/*.sig
            installers/**/*.whl
      - name: Verify Docker Hub destination and existing version
        if: steps.release_state.outputs.publish == 'true'
        id: docker_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release_state.outputs.version }}
        run: |
          source_private=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')
          exists=$(python3 scripts/verify_release_version.py docker-destination \
            --source-private "$source_private" --image-tag "$RELEASE_VERSION")
          printf 'exists=%s\n' "$exists" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        if: steps.release_state.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Enable arm64 builds
        if: steps.release_state.outputs.publish == 'true' && steps.docker_state.outputs.exists == 'false'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        if: steps.release_state.outputs.publish == 'true' && steps.docker_state.outputs.exists == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build amd64 and arm64 images without publishing
        if: steps.release_state.outputs.publish == 'true' && steps.docker_state.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.release_state.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release_state.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release_state.outputs.revision }}
          outputs: type=oci,dest=${{ runner.temp }}/neurodaily-image.tar
          push: false
      - name: Publish and verify the Docker image tags
        if: steps.release_state.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release_state.outputs.version }}
          RELEASE_REVISION: ${{ steps.release_state.outputs.revision }}
        run: |
          set -euo pipefail
          authfile="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          manifest="$RUNNER_TEMP/docker-index.json"
          checked_tag() {
            local source_private
            source_private=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private') || return
            python3 scripts/verify_release_version.py docker-destination \
              --source-private "$source_private" --image-tag "$1"
          }
          read_platforms() {
            skopeo inspect --authfile "$authfile" --raw "$1" > "$manifest"
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' \
              "$manifest" >/dev/null
          }
          manifest_digest() {
            sha256sum "$1" | awk '{print "sha256:" $1}'
          }
          version_ref="$DOCKER_IMAGE:$RELEASE_VERSION"
          exists=$(checked_tag "$RELEASE_VERSION")
          staged_digest=""
          if [[ "$exists" == false ]]; then
            archive="oci-archive:$RUNNER_TEMP/neurodaily-image.tar"
            read_platforms "$archive"
            staged_digest=$(manifest_digest "$manifest")
            verified_version=$(checked_tag "$RELEASE_VERSION")
            test "$verified_version" = false
            skopeo copy --authfile "$authfile" --all --preserve-digests "$archive" "docker://$version_ref"
          fi

          read_platforms "docker://$version_ref"
          digest=$(manifest_digest "$manifest")
          if [[ -n "$staged_digest" ]]; then test "$digest" = "$staged_digest"; fi
          while IFS= read -r platform_digest; do
            [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            skopeo inspect --authfile "$authfile" --config "docker://$DOCKER_IMAGE@$platform_digest" |
              jq -e --arg version "$RELEASE_VERSION" --arg revision "$RELEASE_REVISION" \
                '.config.Labels["org.opencontainers.image.version"] == $version and
                 .config.Labels["org.opencontainers.image.revision"] == $revision' >/dev/null
          done < <(jq -r '.manifests[] | select(.platform.os == "linux") | .digest' "$manifest")

          latest_exists=$(checked_tag latest)
          latest=""
          if [[ "$latest_exists" == true ]]; then
            skopeo inspect --authfile "$authfile" --raw "docker://$DOCKER_IMAGE:latest" > "$manifest"
            latest=$(manifest_digest "$manifest")
          fi
          if [[ "$latest" != "$digest" ]]; then
            if [[ -n "$latest" ]]; then
              previous=$(skopeo inspect --authfile "$authfile" --config "docker://$DOCKER_IMAGE@$latest" |
                jq -r '.config.Labels["org.opencontainers.image.version"] // ""')
              if [[ "$previous" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                python3 - "$RELEASE_VERSION" "${previous#v}" <<'PY'
          import sys
          target, current = (tuple(map(int, value.split('.'))) for value in sys.argv[1:])
          if current > target:
              raise SystemExit('Docker Hub latest already points to a newer version.')
          PY
              fi
            fi
            verified_latest=$(checked_tag latest)
            test "$latest_exists" = "$verified_latest"
            if [[ "$verified_latest" == true ]]; then
              skopeo inspect --authfile "$authfile" --raw "docker://$DOCKER_IMAGE:latest" > "$manifest"
              test "$latest" = "$(manifest_digest "$manifest")"
            fi
            skopeo copy --authfile "$authfile" --all --preserve-digests \
              "docker://$DOCKER_IMAGE@$digest" "docker://$DOCKER_IMAGE:latest"
          fi
          read_platforms "docker://$DOCKER_IMAGE:latest"
          test "$digest" = "$(manifest_digest "$manifest")"
          printf 'Docker Hub %s and latest verified at %s\n' "$version_ref" "$digest"
      - name: Publish the complete release
        if: steps.release_state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
