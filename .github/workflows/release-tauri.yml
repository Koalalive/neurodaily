name: Release Tauri desktop

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app
            dmg_arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
            dmg_arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev xvfb xauth

      - name: Python venv (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pyinstaller

      - name: Python venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install -e . pyinstaller

      - name: Install Tauri CLI
        working-directory: desktop/tauri
        run: npm ci

      - name: Generate icons
        working-directory: desktop/tauri
        run: npm run icon

      - name: Build sidecar (Unix)
        if: runner.os != 'Windows'
        run: bash desktop/build_sidecar.sh

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/build_sidecar.ps1

      - name: Smoke test frozen sidecar
        run: python desktop/sidecar/smoke.py desktop/tauri/src-tauri/binaries/neurodaily-server-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Build preview app
        if: github.ref_type != 'tag'
        working-directory: desktop/tauri
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci

      - name: Build signed release app
        if: github.ref_type == 'tag'
        working-directory: desktop/tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updates.conf.json --ci

      - name: Verify Windows icons and hidden helper launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./desktop/verify_windows_icons.ps1 -Target '${{ matrix.target }}' -ReleaseDir 'desktop/tauri/src-tauri/target/${{ matrix.target }}/release'
          cargo test --manifest-path desktop/tauri/src-tauri/Cargo.toml --locked --release --target '${{ matrix.target }}' --features custom-protocol

      - name: Verify scheduled search from the installed Debian package
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUNDLE_DIR: desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          version=$(node -p "require('./desktop/tauri/src-tauri/tauri.conf.json').version")
          deb="$PWD/$BUNDLE_DIR/deb/NeuroDaily_${version}_amd64.deb"
          sudo apt-get install -y "$deb"
          package=$(dpkg-deb -f "$deb" Package)
          test "$(dpkg-query -W -f='${Version}' "$package")" = "$version"
          test -x /usr/bin/neurodaily-server
          xvfb-run -a python desktop/sidecar/smoke.py --desktop --expect-version "$version" /usr/bin/neurodaily-desktop

      - name: Create and verify macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUNDLE_DIR: desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle
          DMG_ARCH: ${{ matrix.dmg_arch }}
        run: |
          version=$(node -p "require('./desktop/tauri/src-tauri/tauri.conf.json').version")
          python desktop/sidecar/smoke.py "$BUNDLE_DIR/macos/NeuroDaily.app/Contents/MacOS/neurodaily-server"
          image="$BUNDLE_DIR/dmg/NeuroDaily_${version}_${DMG_ARCH}.dmg"
          bash desktop/build_dmg.sh "$BUNDLE_DIR/macos/NeuroDaily.app" "$image"
          python desktop/sidecar/installer_smoke.py "$image" "$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            updater="$BUNDLE_DIR/macos/NeuroDaily_${version}_${DMG_ARCH}.app.tar.gz"
            mv "$BUNDLE_DIR/macos/NeuroDaily.app.tar.gz" "$updater"
            mv "$BUNDLE_DIR/macos/NeuroDaily.app.tar.gz.sig" "$updater.sig"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurodaily-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  windows-installer:
    name: Verify Windows installer (${{ matrix.scenario }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean, upgrade]
    env:
      BASELINE_TAG: v1.0.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: neurodaily-x86_64-pc-windows-msvc
          path: installers
      - name: Download and verify previously published installer
        if: matrix.scenario == 'upgrade'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:BASELINE_TAG.TrimStart('v')
          $assetName = "NeuroDaily_${version}_x64-setup.exe"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:BASELINE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft -or $release.prerelease) {
            throw "Could not read stable release $env:BASELINE_TAG"
          }
          $assets = @($release.assets | Where-Object { $_.name -eq $assetName })
          if ($assets.Count -ne 1 -or $assets[0].digest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Missing installer or digest for $env:BASELINE_TAG"
          }
          gh release download $env:BASELINE_TAG --repo $env:GITHUB_REPOSITORY --dir baseline --pattern $assetName
          if ($LASTEXITCODE -ne 0) { throw "Could not download $assetName" }
          $actual = (Get-FileHash (Join-Path baseline $assetName) -Algorithm SHA256).Hash
          if ("sha256:$actual" -ne $assets[0].digest) { throw "Baseline installer digest mismatch" }
      - name: Run installed desktop application's scheduled-search regression
        shell: pwsh
        env:
          INSTALL_SCENARIO: ${{ matrix.scenario }}
        run: |
          $version = (Get-Content -Raw desktop/tauri/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $candidate = @(Get-ChildItem installers -File -Recurse -Filter "NeuroDaily_${version}_x64-setup.exe")
          if ($candidate.Count -ne 1) { throw "Expected exactly one candidate setup EXE" }
          $smokeArgs = @('desktop/sidecar/installer_smoke.py', $candidate[0].FullName, $version)
          if ($env:INSTALL_SCENARIO -eq 'upgrade') {
            $baselineVersion = $env:BASELINE_TAG.TrimStart('v')
            $smokeArgs += @('--baseline', "baseline/NeuroDaily_${baselineVersion}_x64-setup.exe", '--baseline-version', $baselineVersion)
          }
          & python @smokeArgs

  publish:
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: neurodaily-*
          path: installers
          merge-multiple: true
      - name: Verify all installer and updater assets
        run: python3 desktop/verify_update_assets.py installers "$GITHUB_REF_NAME"
      - name: Upload assets to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            Windows 验证了全新安装及从 v1.0.4 覆盖升级，macOS 和 Linux 分别验证了从 DMG 和 DEB 安装后运行定时检索。启用定时并保存后，最小化窗口可继续运行。

            运行历史显示各来源的进度和投递回执，失败渠道可单独重试。日报先于 AI 摘要和投递完成，重启后可继续查看。CLI 提供 search-quality 命令，使用固定标注样本比较检索规则。

            macOS 安装包使用临时签名。首次打开时，macOS 可能要求在「系统设置 → 隐私与安全性」中单独批准。

          fail_on_unmatched_files: true
          files: |
            installers/**/*.dmg
            installers/**/*.msi
            installers/**/*.exe
            installers/**/*.AppImage
            installers/**/*.deb
            installers/**/*.app.tar.gz
            installers/**/*.sig
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
