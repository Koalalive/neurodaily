name: Release NeuroDaily

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
      - "verify/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/heads/verify/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev xvfb xauth

      - name: Python venv (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pyinstaller

      - name: Python venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install -e . pyinstaller

      - name: Install Tauri CLI
        working-directory: desktop/tauri
        run: npm ci

      - name: Generate icons
        working-directory: desktop/tauri
        run: npm run icon

      - name: Build sidecar (Unix)
        if: runner.os != 'Windows'
        run: bash desktop/build_sidecar.sh

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/build_sidecar.ps1

      - name: Smoke test frozen sidecar
        run: python desktop/sidecar/smoke.py desktop/tauri/src-tauri/binaries/neurodaily-server-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Build preview app
        if: github.ref_type != 'tag'
        working-directory: desktop/tauri
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci

      - name: Build signed release app
        if: github.ref_type == 'tag'
        working-directory: desktop/tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updates.conf.json --ci

      - name: Verify Windows icons and hidden helper launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./desktop/verify_windows_icons.ps1 -Target '${{ matrix.target }}' -ReleaseDir 'desktop/tauri/src-tauri/target/${{ matrix.target }}/release'
          cargo test --manifest-path desktop/tauri/src-tauri/Cargo.toml --locked --release --target '${{ matrix.target }}' --features custom-protocol

      - name: Verify scheduled search from the installed Debian package
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUNDLE_DIR: desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          version=$(node -p "require('./desktop/tauri/src-tauri/tauri.conf.json').version")
          deb="$PWD/$BUNDLE_DIR/deb/NeuroDaily_${version}_amd64.deb"
          sudo apt-get install -y "$deb"
          package=$(dpkg-deb -f "$deb" Package)
          test "$(dpkg-query -W -f='${Version}' "$package")" = "$version"
          test -x /usr/bin/neurodaily-server
          xvfb-run -a python desktop/sidecar/smoke.py --desktop --expect-version "$version" /usr/bin/neurodaily-desktop

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurodaily-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  homebrew:
    name: Verify macOS Homebrew (${{ matrix.os }})
    if: ${{ !startsWith(github.ref, 'refs/heads/verify/') || startsWith(github.ref, 'refs/heads/verify/homebrew-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the formula and verify the localhost workspace
        run: bash scripts/test_homebrew.sh

  windows-installer:
    name: Verify Windows installer (${{ matrix.scenario }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean, upgrade]
    env:
      BASELINE_TAG: v1.0.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: neurodaily-x86_64-pc-windows-msvc
          path: installers
      - name: Download and verify previously published installer
        if: matrix.scenario == 'upgrade'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:BASELINE_TAG.TrimStart('v')
          $assetName = "NeuroDaily_${version}_x64-setup.exe"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:BASELINE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft -or $release.prerelease) {
            throw "Could not read stable release $env:BASELINE_TAG"
          }
          $assets = @($release.assets | Where-Object { $_.name -eq $assetName })
          if ($assets.Count -ne 1 -or $assets[0].digest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Missing installer or digest for $env:BASELINE_TAG"
          }
          gh release download $env:BASELINE_TAG --repo $env:GITHUB_REPOSITORY --dir baseline --pattern $assetName
          if ($LASTEXITCODE -ne 0) { throw "Could not download $assetName" }
          $actual = (Get-FileHash (Join-Path baseline $assetName) -Algorithm SHA256).Hash
          if ("sha256:$actual" -ne $assets[0].digest) { throw "Baseline installer digest mismatch" }
      - name: Run installed desktop application's scheduled-search regression
        shell: pwsh
        env:
          INSTALL_SCENARIO: ${{ matrix.scenario }}
        run: |
          $version = (Get-Content -Raw desktop/tauri/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $candidate = @(Get-ChildItem installers -File -Recurse -Filter "NeuroDaily_${version}_x64-setup.exe")
          if ($candidate.Count -ne 1) { throw "Expected exactly one candidate setup EXE" }
          $smokeArgs = @('desktop/sidecar/installer_smoke.py', $candidate[0].FullName, $version)
          if ($env:INSTALL_SCENARIO -eq 'upgrade') {
            $baselineVersion = $env:BASELINE_TAG.TrimStart('v')
            $smokeArgs += @('--baseline', "baseline/NeuroDaily_${baselineVersion}_x64-setup.exe", '--baseline-version', $baselineVersion)
          }
          & python @smokeArgs

  extra-installer:
    name: Verify ${{ matrix.scenario }}
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (startsWith(github.ref, 'refs/heads/verify/') && !startsWith(github.ref, 'refs/heads/verify/homebrew-'))) }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: Windows MSI
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - scenario: Linux package upgrade and native dialogs
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      BASELINE_TAG: v1.0.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate package artifacts
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$GITHUB_RUN_ID"
          if [[ "$GITHUB_REF_NAME" == verify/* ]]; then
            branch="release/${GITHUB_REF_NAME#verify/}-preview"
            run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/release-tauri.yml/runs" \
              -f branch="$branch" -f event=push -f status=success -f per_page=1 --jq '.workflow_runs[0].id // empty')
            test -n "$run_id"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifacts.outputs.run_id }}
          name: neurodaily-${{ matrix.target }}
          path: installers
      - name: Install and run Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw desktop/tauri/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $candidate = @(Get-ChildItem installers -File -Recurse -Filter "NeuroDaily_${version}_x64_en-US.msi")
          if ($candidate.Count -ne 1) { throw 'Expected exactly one MSI candidate' }
          & python desktop/sidecar/msi_smoke.py $candidate[0].FullName $version
      - name: Install Linux smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb xauth webkit2gtk-driver xdotool
      - name: Download and verify the published Debian installer
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          baseline="NeuroDaily_${BASELINE_TAG#v}_amd64.deb"
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BASELINE_TAG" --jq \
            ". | select(.draft == false and .prerelease == false) | .assets[] | select(.name == \"$baseline\") | .digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --dir baseline --pattern "$baseline"
          printf '%s  %s\n' "${digest#sha256:}" "baseline/$baseline" | sha256sum -c -
      - name: Verify Linux upgrade, AppImage and native dialog interaction
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("desktop/tauri/src-tauri/tauri.conf.json"))["version"])')
          previous="${BASELINE_TAG#v}"
          deb=$(find "$PWD/installers" -type f -name "NeuroDaily_${version}_amd64.deb")
          image=$(find "$PWD/installers" -type f -name "NeuroDaily_${version}_amd64.AppImage")
          test -f "$deb" && test -f "$image"
          xvfb-run -a python desktop/sidecar/linux_installer_smoke.py "$deb" "$version" --baseline "baseline/NeuroDaily_${previous}_amd64.deb" --baseline-version "$previous"
          xvfb-run -a python desktop/sidecar/linux_installer_smoke.py "$image" "$version"
          xvfb-run -a python desktop/sidecar/native_ui_smoke.py /usr/bin/neurodaily-desktop "$version"

  publish:
    needs: [build, homebrew, windows-installer, extra-installer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: neurodaily-*
          path: installers
          merge-multiple: true
      - name: Verify all installer and updater assets
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 desktop/verify_update_assets.py installers "$GITHUB_REF_NAME"
      - name: Upload assets to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            macOS 使用私有 Homebrew tap 安装命令行，并用 `neurodaily web` 在默认浏览器打开本机工作区。支持 Apple Silicon 和 Intel。安装与旧版数据迁移见 [macOS Homebrew 指南](https://github.com/Koalalive/neurodaily/blob/main/docs/MACOS_HOMEBREW.md)。

            Windows 验证了 NSIS 和 MSI 全新安装，以及从 v1.0.4 覆盖升级。Ubuntu 验证了 DEB 安装和覆盖升级，以及 AppImage 解包运行。

            桌面工作区采用单行标签页，常用页面复用已打开的标签，最新日报标签显示生成日期。每次检索仍会打开独立的结果标签页。

            日报在 AI 摘要之后显示离线研究地图，移除文献计量卡片。设置中可查看每次模型调用的 token 和费用估算。可选的 AI 地理定位默认关闭，底图数据来自 Natural Earth。

            新闻、政策和试验支持独立检索规则。PubMed 补查晚入库论文，ClinicalTrials.gov 支持分批翻页。历史条目可在本机检索，设置中可按需开启新增来源。

          fail_on_unmatched_files: true
          files: |
            installers/**/*.msi
            installers/**/*.exe
            installers/**/*.AppImage
            installers/**/*.deb
            installers/**/*.sig
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
