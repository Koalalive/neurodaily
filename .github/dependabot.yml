version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /
      - /.github
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /desktop/tauri
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /desktop/tauri/src-tauri
    schedule:
      interval: weekly
